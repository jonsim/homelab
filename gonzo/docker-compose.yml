services:
  caddy:
    image: caddy:alpine
    container_name: web-caddy
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - php
    networks:
      - webnet
    # No "ports:" section on purpose — the proxy is only reachable via the
    # internal Docker network; cloudflared talks to it directly.

  php:
    build: ./php
    container_name: web-php
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - db
    networks:
      - webnet

  db:
    image: mariadb:11
    container_name: web-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - webnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: web-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - caddy
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  db_data:
