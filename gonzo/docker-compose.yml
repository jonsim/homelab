services:
  nginx:
    image: nginx:stable-alpine
    container_name: web-nginx
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - webnet
    # No "ports:" section on purpose — nginx is only reachable via the
    # internal Docker network. cloudflared talks to it directly; nothing
    # is exposed to your LAN or the internet on this host.

  php:
    build: ./php
    container_name: web-php
    restart: unless-stopped
    volumes:
      - ./www:/var/www/html
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - db
    networks:
      - webnet

  db:
    image: mariadb:11
    container_name: web-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - webnet
    # No host port published either — only the php container can reach
    # it, via the "db" hostname on the webnet network.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: web-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  db_data:
