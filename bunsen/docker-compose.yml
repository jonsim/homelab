name: bunsen

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.4@sha256:3e6710a7ab2a61311d9d899b719f6c3657791c63e8f4942cec4ebc42401d6b76
    container_name: bunsen-homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    stop_grace_period: 60s
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

  caddy:
    build:
      context: ./caddy
    container_name: bunsen-caddy
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in .env}
      HA_DOMAIN: ${HA_DOMAIN:-homeassistant.home.jonsim.com}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - homeassistant

  portainer-agent:
    image: portainer/agent:2.45.1@sha256:38bc1dc7b8470eecbd979d444aa5d0a187dacf1245f2b54466f0f25f4c6d9a7c
    container_name: bunsen-portainer-agent
    restart: unless-stopped
    # If Gonzo's Portainer Server uses AGENT_SECRET, uncomment these lines and
    # set the identical value in Bunsen's .env file.
    # environment:
    #   AGENT_SECRET: ${AGENT_SECRET:?Set AGENT_SECRET in .env}
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

volumes:
  caddy_data:
  caddy_config:
