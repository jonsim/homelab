name: bunsen

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HOME_ASSISTANT_VERSION:-2026.9.4}
    container_name: bunsen-homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    stop_grace_period: 60s
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

  caddy:
    build:
      context: ./caddy
      args:
        CADDY_VERSION: ${CADDY_VERSION:-2.11.4}
    container_name: bunsen-caddy
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in .env}
      HA_DOMAIN: ${HA_DOMAIN:-homeassistant.home.jonsim.com}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - homeassistant

  portainer-agent:
    image: portainer/agent:lts
    container_name: bunsen-portainer-agent
    restart: unless-stopped
    # If Gonzo's Portainer Server uses AGENT_SECRET, uncomment these lines and
    # set the identical value in Bunsen's .env file.
    # environment:
    #   AGENT_SECRET: ${AGENT_SECRET:?Set AGENT_SECRET in .env}
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

volumes:
  caddy_data:
  caddy_config:
