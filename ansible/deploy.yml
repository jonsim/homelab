---
- name: Deploy homelab Docker stacks
  hosts: homelab
  gather_facts: false
  serial: 1

  tasks:
    - name: Check SOPS on the controller
      ansible.builtin.command: sops --version
      delegate_to: localhost
      run_once: true
      changed_when: false
      check_mode: false

    - name: Check the encrypted environment file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../{{ stack_source }}/secrets.sops.env"
      delegate_to: localhost
      register: encrypted_environment

    - name: Require an encrypted environment file
      ansible.builtin.assert:
        that: encrypted_environment.stat.isreg | default(false)
        fail_msg: >-
          Missing {{ stack_source }}/secrets.sops.env. Follow the secrets setup
          instructions in the repository README before deploying.

    - name: Decrypt the deployment environment in memory
      ansible.builtin.set_fact:
        stack_environment: >-
          {{ lookup(
            'community.sops.sops',
            playbook_dir ~ '/../' ~ stack_source ~ '/secrets.sops.env',
            input_type='dotenv',
            output_type='dotenv',
            rstrip=false
          ) }}
      no_log: true

    - name: Require deployment secrets to be configured
      ansible.builtin.assert:
        that:
          - "'replace_with_' not in stack_environment"
        fail_msg: >-
          {{ stack_source }}/secrets.sops.env still contains example values.
          Edit it with SOPS before deploying.

    - name: Check the remote deployment prerequisites
      ansible.builtin.raw: |
        missing=""
        for prerequisite in rsync docker base64 sha256sum awk; do
          if ! command -v "$prerequisite" >/dev/null 2>&1; then
            missing="${missing} ${prerequisite}"
          fi
        done
        if command -v docker >/dev/null 2>&1 && ! docker compose version >/dev/null 2>&1; then
          missing="${missing} docker-compose-plugin"
        fi
        if command -v docker >/dev/null 2>&1 && ! docker info >/dev/null 2>&1; then
          missing="${missing} docker-daemon-access"
        fi
        if test -n "$missing"; then
          echo "Missing deployment prerequisites:${missing}" >&2
          exit 1
        fi
      changed_when: false
      check_mode: false

    - name: Synchronize the stack definition
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../{{ stack_source }}/"
        dest: "{{ stack_path }}/"
        archive: true
        compress: true
        delete: false
        owner: false
        group: false
        rsync_opts: "{{ stack_rsync_excludes }}"

    - name: Install the decrypted deployment environment
      ansible.builtin.raw: |
        target={{ (stack_path ~ '/.env') | quote }}
        expected={{ stack_environment | hash('sha256') | quote }}
        if test -f "$target"; then
          current=$(sha256sum "$target" | awk '{print $1}')
        else
          current=""
        fi
        if test "$current" != "$expected"; then
          temporary="${target}.tmp.$$"
          umask 077
          printf '%s' {{ stack_environment | b64encode | quote }} | base64 --decode > "$temporary"
          chmod 0600 "$temporary"
          mv "$temporary" "$target"
          echo environment-updated
        else
          chmod 0600 "$target"
          echo environment-unchanged
        fi
      register: environment_install
      changed_when: "'environment-updated' in environment_install.stdout"
      no_log: true

    - name: Validate the Docker Compose model
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} &&
        docker compose --ansi never --progress plain config --quiet
      changed_when: false

    - name: Pull service images
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} &&
        docker compose --ansi never --progress plain pull --quiet
      register: compose_pull
      changed_when: "'Pulled' in compose_pull.stderr or 'Downloaded' in compose_pull.stderr"

    - name: Build custom service images
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} &&
        docker compose --ansi never --progress plain build --pull
      register: compose_build
      changed_when: "'exporting to image' in compose_build.stdout or 'exporting to image' in compose_build.stderr"

    - name: Reconcile the Docker Compose stack
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} &&
        docker compose --ansi never --progress plain up
        --detach --remove-orphans --wait --wait-timeout 300
      register: compose_up
      changed_when: >-
        'Created' in compose_up.stderr or
        'Recreated' in compose_up.stderr or
        'Started' in compose_up.stderr

    - name: Show the deployed service state
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} &&
        docker compose --ansi never --progress plain ps
      changed_when: false
      register: compose_ps

    - name: Report the deployed service state
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
      when: not ansible_check_mode
