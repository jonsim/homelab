---
- name: Deploy homelab Docker stacks
  hosts: homelab
  gather_facts: false
  serial: 1

  tasks:
    - name: Check SOPS on the controller
      ansible.builtin.command: sops --version
      delegate_to: localhost
      run_once: true
      changed_when: false
      check_mode: false

    - name: Check the encrypted environment file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../{{ stack_source }}/secrets.sops.env"
      delegate_to: localhost
      register: encrypted_environment

    - name: Require an encrypted environment file
      ansible.builtin.assert:
        that: encrypted_environment.stat.isreg | default(false)
        fail_msg: >-
          Missing {{ stack_source }}/secrets.sops.env. Follow the secrets setup
          instructions in the repository README before deploying.

    - name: Decrypt the deployment environment in memory
      ansible.builtin.set_fact:
        stack_environment: >-
          {{ lookup(
            'community.sops.sops',
            playbook_dir ~ '/../' ~ stack_source ~ '/secrets.sops.env',
            input_type='dotenv',
            output_type='dotenv',
            rstrip=false
          ) }}
      no_log: true

    - name: Require deployment secrets to be configured
      ansible.builtin.assert:
        that:
          - "'replace_with_' not in stack_environment"
        fail_msg: >-
          {{ stack_source }}/secrets.sops.env still contains example values.
          Edit it with SOPS before deploying.

    - name: Check rsync on the target
      ansible.builtin.command: rsync --version
      changed_when: false
      check_mode: false

    - name: Check Docker daemon access
      ansible.builtin.command: docker info
      changed_when: false
      check_mode: false

    - name: Check the Docker Compose plugin
      ansible.builtin.command: docker compose version
      changed_when: false
      check_mode: false

    - name: Synchronize the stack definition
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../{{ stack_source }}/"
        dest: "{{ stack_path }}/"
        archive: true
        compress: true
        delete: false
        owner: false
        group: false
        rsync_opts: "{{ stack_rsync_excludes }}"

    - name: Install the decrypted deployment environment
      ansible.builtin.copy:
        content: "{{ stack_environment }}"
        dest: "{{ stack_path }}/.env"
        mode: "0600"
      no_log: true

    - name: Validate the Docker Compose model
      ansible.builtin.command: docker compose --ansi never --progress plain config --quiet
      args:
        chdir: "{{ stack_path }}"
      changed_when: false

    - name: Pull service images
      ansible.builtin.command: docker compose --ansi never --progress plain pull --quiet
      args:
        chdir: "{{ stack_path }}"
      register: compose_pull
      changed_when: "'Pulled' in compose_pull.stderr or 'Downloaded' in compose_pull.stderr"

    - name: Build custom service images
      ansible.builtin.command: docker compose --ansi never --progress plain build --pull
      args:
        chdir: "{{ stack_path }}"
      register: compose_build
      changed_when: "'exporting to image' in compose_build.stdout or 'exporting to image' in compose_build.stderr"

    - name: Reconcile the Docker Compose stack
      ansible.builtin.command: >-
        docker compose --ansi never --progress plain up --detach
        --remove-orphans --wait --wait-timeout 300
      args:
        chdir: "{{ stack_path }}"
      register: compose_up
      changed_when: >-
        'Created' in compose_up.stderr or
        'Recreated' in compose_up.stderr or
        'Started' in compose_up.stderr

    - name: Show the deployed service state
      ansible.builtin.command: docker compose --ansi never --progress plain ps
      args:
        chdir: "{{ stack_path }}"
      changed_when: false
      register: compose_ps

    - name: Report the deployed service state
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
      when: not ansible_check_mode
