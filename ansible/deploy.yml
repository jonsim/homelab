---
- name: Deploy homelab Docker stacks
  hosts: homelab
  gather_facts: false
  serial: 1

  tasks:
    - name: Check the remote deployment prerequisites
      ansible.builtin.raw: >-
        command -v rsync >/dev/null &&
        command -v docker >/dev/null &&
        docker compose version >/dev/null
      changed_when: false
      check_mode: false

    - name: Synchronize the stack definition
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../{{ stack_source }}/"
        dest: "{{ stack_path }}/"
        archive: true
        compress: true
        delete: false
        owner: false
        group: false
        rsync_opts: "{{ stack_rsync_excludes }}"

    - name: Check the deployment environment file
      ansible.builtin.raw: "test -f {{ (stack_path ~ '/.env') | quote }}"
      register: stack_env
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create the initial host-local environment file
      ansible.builtin.raw: >-
        install -m 0600
        {{ (stack_path ~ '/.env.example') | quote }}
        {{ (stack_path ~ '/.env') | quote }}
      when: stack_env.rc != 0

    - name: Require the initial environment file to be configured
      ansible.builtin.fail:
        msg: >-
          {% if ansible_check_mode %}Missing{% else %}Created{% endif %}
          {{ stack_path }}/.env on {{ inventory_hostname }}.
          {% if ansible_check_mode %}Run a normal deployment to create it, then
          {% endif %}replace every placeholder secret and address before
          deploying the stack.
      when: stack_env.rc != 0

    - name: Validate the Docker Compose model
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} && docker compose config --quiet
      changed_when: false

    - name: Pull service images
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} && docker compose pull --quiet
      register: compose_pull
      changed_when: "'Pulled' in compose_pull.stderr or 'Downloaded' in compose_pull.stderr"

    - name: Build custom service images
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} && docker compose build --pull
      register: compose_build
      changed_when: "'exporting to image' in compose_build.stdout or 'exporting to image' in compose_build.stderr"

    - name: Reconcile the Docker Compose stack
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} &&
        docker compose up --detach --remove-orphans --wait --wait-timeout 300
      register: compose_up
      changed_when: >-
        'Created' in compose_up.stderr or
        'Recreated' in compose_up.stderr or
        'Started' in compose_up.stderr

    - name: Show the deployed service state
      ansible.builtin.raw: >-
        cd {{ stack_path | quote }} && docker compose ps
      changed_when: false
      register: compose_ps

    - name: Report the deployed service state
      ansible.builtin.debug:
        var: compose_ps.stdout_lines
      when: not ansible_check_mode
