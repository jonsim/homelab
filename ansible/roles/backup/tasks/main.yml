---
- name: Create backup state directory
  ansible.builtin.file:
    path: /var/lib/homelab-backup
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install backup environment
  ansible.builtin.template:
    src: backup.env.j2
    dest: /etc/homelab-backup.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install backup runner
  ansible.builtin.template:
    src: homelab-backup.sh.j2
    dest: /usr/local/sbin/homelab-backup
    owner: root
    group: root
    mode: "0750"

- name: Check the pinned Restic image
  ansible.builtin.command: "docker image inspect {{ backup_restic_image }}"
  register: backup_restic_image_status
  changed_when: false
  failed_when: false

- name: Pull the pinned Restic image
  ansible.builtin.command: "docker pull {{ backup_restic_image }}"
  when: backup_restic_image_status.rc != 0
  changed_when: true

- name: Install backup service
  ansible.builtin.copy:
    src: homelab-backup.service
    dest: /etc/systemd/system/homelab-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install backup timer
  ansible.builtin.copy:
    src: homelab-backup.timer
    dest: /etc/systemd/system/homelab-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable nightly backup timer
  ansible.builtin.systemd_service:
    name: homelab-backup.timer
    enabled: true
    state: started
    daemon_reload: true
