---
- name: Remove packages that conflict with Docker Engine
  ansible.builtin.apt:
    name:
      - containerd
      - docker-buildx
      - docker-compose
      - docker-doc
      - docker.io
      - podman-docker
      - runc
    state: absent

- name: Create the Apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's Apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker's Apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Add the deployment user to the Docker group
  ansible.builtin.user:
    name: "{{ bootstrap_user }}"
    groups: docker
    append: true
  notify: Reset SSH connection

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Flush Docker role handlers
  ansible.builtin.meta: flush_handlers

- name: Verify Docker access as the deployment user
  ansible.builtin.command: docker info
  become: false
  changed_when: false

- name: Verify the Docker Compose plugin
  ansible.builtin.command: docker compose version
  become: false
  changed_when: false
